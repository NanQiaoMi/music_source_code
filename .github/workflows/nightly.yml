name: Nightly perf

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-perf-${{ github.ref }}
  cancel-in-progress: true

# Bundle-only nightly (static, no browser). Runtime/soak jobs stay out until the S5
# harness lands (S8-3b/c). Thresholds and rebaseline flow: perf/README.md #8.
jobs:
  bundle-nightly:
    name: Bundle regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # S8-3d: the history commit-back below needs to push one commit per run. Scope the write
    # token to this job so the workflow default (and any future job) stays contents: read.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nightly always appends to the default branch, even when dispatched from a topic branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Production build
        run: npm run build
      - name: Bundle report
        run: node scripts/perf/bundle-budget.mjs --json perf/bundle-report.json
      - name: Test suite
        run: npm run test -- --run
      - name: Bundle diff vs committed baseline
        run: npm run perf:bundle:diff -- --json perf/bundle-diff.json --md perf/bundle-diff.md
      - name: Audio metrics (optional)
        if: hashFiles('scripts/perf/audio-metrics.mjs') != ''
        continue-on-error: true
        run: node scripts/perf/audio-metrics.mjs --out perf/audio-metrics.json
      - name: Append perf history
        if: always()
        run: |
          if [ ! -f perf/bundle-report.json ]; then
            echo "[nightly] bundle report missing; skip history append"
            exit 0
          fi
          if [ -f perf/audio-metrics.json ]; then
            node scripts/perf/append-history.mjs --report perf/bundle-report.json --metrics perf/audio-metrics.json
          else
            node scripts/perf/append-history.mjs --report perf/bundle-report.json
          fi
      - name: Perf dashboard
        if: always()
        run: node scripts/perf/perf-dashboard.mjs --out perf/perf-dashboard.md
      # S8-3d: commit-back so perf/perf-history.jsonl accrues across runs instead of living only
      # in the run artifact. Runs even when an earlier regression step failed, so the failing
      # measurement is still recorded. GITHUB_TOKEN pushes do not re-trigger workflows; the
      # [skip ci] marker is belt-and-suspenders for forks/other tokens.
      - name: Commit perf history
        if: always()
        run: |
          if [ ! -f perf/perf-history.jsonl ]; then
            echo "[nightly] perf/perf-history.jsonl missing (no bundle report); skip commit-back"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perf/perf-history.jsonl perf/reports && git diff --cached --quiet || (git commit -m 'chore(perf): nightly history [skip ci]' && git push origin "HEAD:${{ github.event.repository.default_branch }}")
      - name: Job summary
        if: always()
        run: |
          if [ -f perf/perf-dashboard.md ]; then cat perf/perf-dashboard.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f perf/bundle-diff.md ]; then cat perf/bundle-diff.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bundle-${{ github.run_id }}
          path: |
            perf/audio-metrics.json
            perf/bundle-report.json
            perf/bundle-diff.json
            perf/bundle-diff.md
            perf/perf-history.jsonl
            perf/perf-dashboard.md
          if-no-files-found: ignore
