name: Release (manual, draft)
# Manual only: tag pushes never auto-publish. Both inputs must match package.json.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (must match package.json)"
        required: true
        type: string
      tag:
        description: "Release tag with v prefix (must be v<version>)"
        required: true
        type: string
      package_desktop:
        description: "Also package Windows desktop artifacts (requires S7-4/D2)"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify version input matches package.json
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'const p=require("./package.json");const v=process.env.RELEASE_VERSION,t=process.env.RELEASE_TAG;if(p.version!==v||"v"+p.version!==t){console.error("version/tag mismatch: package="+p.version+" input="+v+"/"+t);process.exit(1)}'
      - name: Run release preflight
        run: |
          set -o pipefail
          node scripts/release/preflight.mjs --tag "${{ inputs.tag }}" | tee release-preflight.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-preflight
          path: release-preflight.txt
          retention-days: 30
  package-web:
    name: Package web build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create web archive and checksums
        run: |
          mkdir -p release
          files=".next public package.json package-lock.json next.config.js"
          if [ -d out ]; then files="$files out"; fi
          tar --exclude='.next/cache' -czf "release/web-next-${{ inputs.tag }}.tar.gz" $files
          cd release
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release/
          retention-days: 90
  package-desktop:
    name: Package Windows desktop (optional)
    needs: preflight
    if: ${{ inputs.package_desktop }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -r backend/requirements-minimal.txt
      - name: Build desktop (guard blocks until D2/S7-4)
        run: npm run build:electron:win
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = foreach ($f in Get-ChildItem dist-electron -File -Filter *.exe) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii dist-electron/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: dist-electron/
          retention-days: 90
  draft-release:
    name: Create draft GitHub release
    needs: [preflight, package-web, package-desktop]
    if: always() && needs.preflight.result == 'success' && needs.package-web.result == 'success' && (needs.package-desktop.result == 'success' || needs.package-desktop.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files and notes
        run: |
          mkdir -p release-files
          cp -r artifacts/release-preflight/* release-files/ 2>/dev/null || true
          cp -r artifacts/release-web/* release-files/ 2>/dev/null || true
          if [ -d artifacts/release-desktop ]; then
            find artifacts/release-desktop -maxdepth 1 -type f -exec cp {} release-files/ \;
            find artifacts/release-desktop -path '*/resources/*' -type f -exec cp {} release-files/ \;
          fi
          ls -la release-files
          cat > release-notes.md <<'EOF'
          ## ${{ inputs.tag }}
          Draft generated by `.github/workflows/release.yml` from `${{ github.sha }}`.
          The preflight log is in `release-preflight.txt`; web artifacts and checksums
          are in the web bundle; desktop artifacts are included only when requested.
          ### Rollback
          ```bash
          git checkout <previous-tag>
          # rebuild/redeploy the previous web or desktop artifact; do not force-push.
          ```
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
