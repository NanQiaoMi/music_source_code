name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# S8-1b: the former serial `verify` job is split into three parallel jobs so the wall
# time stays inside the 12min budget. Each job repeats checkout/setup/install on purpose:
# no artefact hand-off is needed, and only `build` owns .next (perf:gates bundle markers).
# Layout, per-job durations and required checks: docs/nbl/CI.md.
jobs:
  quality:
    name: Quality (types/lint/unit)
    runs-on: ubuntu-latest
    # Warm ~6-8min, cold ~10-12min; 15min only caps hangs. Budget: docs/nbl/CI.md.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit --incremental false --pretty false
      - name: Lint (src, 0 warnings)
        run: npx eslint src --ext ts,tsx --rulesdir eslint-rules --max-warnings=0 --report-unused-disable-directives
      # S6-12a: dependency-cruiser layering gate (errors only; no-orphans are warnings).
      - name: Layering (dependency-cruiser, 0 errors)
        run: npm run verify:layers
      - name: Unit tests
        run: npm run test -- --run

  coverage:
    name: Coverage (domains)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # Per-domain coverage floors live in perf/coverage-domains.json (S8-2). This re-runs
      # the suite with coverage, so it is run-only and costs ~3min. Budgets: docs/nbl/CI.md.
      - name: Coverage domains
        run: npm run test:coverage:domains

  build:
    name: Build (production/perf/docs)
    runs-on: ubuntu-latest
    # Owns .next for the perf gates, so build + bundle report + docs facts stay together.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json','next.config.js','tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json','next.config.js','tsconfig.json') }}-
      - name: Production build
        run: npm run build
      # Gates run after the production build so .next exists; bundle markers self-skip otherwise.
      - name: Perf gates (store line/cycle budgets, whole-store budget, initial bundle markers)
        run: npm run perf:gates
      - name: Bundle budget (report-only until S4 rebaseline; TODO turn into --check)
        run: node scripts/perf/bundle-budget.mjs --json perf/bundle-report.json
      # NOTE: report-store-stats --check stays disabled: perf/store-stats-baseline.json is
      # stale (60 stores / 44 persist keys vs actual 59 / 43) and fails the "not worse than
      # baseline" check. perf:gates enforces --max-whole 10 instead; re-enable --check after
      # the baseline is regenerated and approved.
      - name: Docs facts
        run: node scripts/check-docs-facts.mjs

  # Single branch-protection check: all three parallel verify jobs must succeed.
  quality-gate:
    name: Quality gate (required)
    if: always()
    needs: [quality, coverage, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate summary
        if: always()
        run: |
          {
            echo "## CI quality gate"
            echo ""
            echo "quality=${{ needs.quality.result }} coverage=${{ needs.coverage.result }} build=${{ needs.build.result }}"
            echo ""
            echo "Layout, durations and required checks: docs/nbl/CI.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every verify job to pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.coverage.result }}" = success
          test "${{ needs.build.result }}" = success

  desktop-windows:
    name: Desktop package (manual/tag only)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install backend build dependencies
        run: |
          python -m pip install -r backend/requirements-minimal.txt
          python -m pip install pyinstaller
      - name: Desktop release readiness guard (S0-3)
        run: node scripts/verify-desktop-release-ready.mjs
      - name: Build Windows desktop artifacts
        shell: pwsh
        run: ./scripts/build-desktop-win.ps1 -SkipInstall
        env:
          VIBE_SKIP_PYTHON_INSTALL: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
      - name: Verify static export freshness
        run: node scripts/verify-static-export.mjs
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mimimusic-windows-x64
          path: |
            dist-electron/*.exe
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error

  deploy-to-vercel:
    name: Deploy to Vercel (manual only)
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Vercel Action
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
